<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ Collapse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>Frequently Asked Questions</h1>

    <div class="faq-list" id="faqList">

      <div class="faq-item">
        <button class="faq-question"
          aria-expanded="false"
          aria-controls="faq1">
          What is FAQ Collapse?
        </button>
        <div class="faq-answer" id="faq1" role="region">
          FAQ Collapse is a simple accordion interface that allows users to expand and collapse answers.
        </div>
      </div>

      <div class="faq-item">
        <button class="faq-question"
          aria-expanded="false"
          aria-controls="faq2">
          Is this built using JavaScript?
        </button>
        <div class="faq-answer" id="faq2" role="region">
          Yes, this project is built using plain Vanilla JavaScript with no external libraries.
        </div>
      </div>

      <div class="faq-item">
        <button class="faq-question"
          aria-expanded="false"
          aria-controls="faq3">
          Is this accessible?
        </button>
        <div class="faq-answer" id="faq3" role="region">
          Yes. It supports keyboard navigation and proper ARIA attributes.
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
